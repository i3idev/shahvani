name: Security

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    # Weekly security scan
    - cron: "30 2 * * 1"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # CodeQL
  # ==========================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build project
        run: ./gradlew --no-daemon assembleDebug

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"


  # ==========================================================
  # Gradle Dependency Audit
  # ==========================================================
  gradle-dependency-audit:
    name: Gradle Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Resolve dependencies
        run: ./gradlew --no-daemon dependencies


  # ==========================================================
  # Secret Scan
  # ==========================================================
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # ==========================================================
  # Sensitive Files
  # ==========================================================
  sensitive-files:
    name: Sensitive File Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for sensitive files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository for sensitive files..."

          forbidden_patterns=(
            "*.jks"
            "*.keystore"
            "*.p12"
            "*.pem"
            "local.properties"
            "keystore.properties"
            ".env"
            ".env.*"
            "secrets.properties"
          )

          found=0

          for pattern in "${forbidden_patterns[@]}"; do
            while IFS= read -r file; do
              if [ -n "$file" ]; then
                echo "::error file=$file::Sensitive file detected: $file"
                found=1
              fi
            done < <(git ls-files "$pattern")
          done

          if [ "$found" -ne 0 ]; then
            echo "Sensitive files are tracked by Git."
            exit 1
          fi

          echo "No forbidden sensitive files found."


  # ==========================================================
  # Android Security Configuration
  # ==========================================================
  dangerous-config:
    name: Android Security Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Android security configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android security configuration..."

          FAILED=0

          # --------------------------------------------------
          # Cleartext traffic
          # --------------------------------------------------
          if grep -RIn \
            --include="AndroidManifest.xml" \
            'android:usesCleartextTraffic="true"' \
            app/src; then

            echo "::error::Cleartext HTTP traffic is explicitly enabled."
            FAILED=1
          fi

          # --------------------------------------------------
          # Explicit debuggable flag
          # --------------------------------------------------
          if grep -RIn \
            --include="AndroidManifest.xml" \
            'android:debuggable="true"' \
            app/src; then

            echo "::error::Debuggable mode must not be explicitly enabled."
            FAILED=1
          fi

          # --------------------------------------------------
          # Exported components
          # --------------------------------------------------
          echo "Checking exported Android components..."

          if grep -RIn \
            --include="AndroidManifest.xml" \
            'android:exported="true"' \
            app/src; then

            echo "::warning::Exported Android component detected. Verify that external access is intentional."
          fi

          # --------------------------------------------------
          # Hardcoded HTTP URLs
          # --------------------------------------------------
          echo "Checking for hardcoded HTTP endpoints..."

          if grep -RInE \
            --include="*.kt" \
            --include="*.java" \
            --include="*.xml" \
            'http://[^/]' \
            app/src; then

            echo "::error::Hardcoded HTTP URL detected."
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "Android security configuration FAILED."
            exit 1
          fi

          echo "Android security configuration passed."


  # ==========================================================
  # Hardcoded Secret Heuristics
  # ==========================================================
  hardcoded-secrets:
    name: Hardcoded Secret Heuristics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan source code
        shell: bash
        run: |
          set -euo pipefail

          echo "Scanning source code for suspicious hardcoded secrets..."

          FAILED=0

          patterns=(
            'api[_-]?key[[:space:]]*=[[:space:]]*["'\''][^"'\'']{16,}'
            'secret[_-]?key[[:space:]]*=[[:space:]]*["'\''][^"'\'']{16,}'
            'password[[:space:]]*=[[:space:]]*["'\''][^"'\'']{8,}'
            'access[_-]?token[[:space:]]*=[[:space:]]*["'\''][^"'\'']{16,}'
            'bearer[[:space:]]+[A-Za-z0-9._-]{20,}'
          )

          for pattern in "${patterns[@]}"; do
            if grep -RInE \
              --exclude-dir=.git \
              --exclude-dir=.gradle \
              --exclude-dir=build \
              --exclude="*.lock" \
              "$pattern" .; then

              echo "::error::Possible hardcoded secret detected."
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "Hardcoded secret heuristic scan FAILED."
            exit 1
          fi

          echo "No obvious hardcoded secrets detected."


  # ==========================================================
  # GitHub Actions Permission Check
  # ==========================================================
  permissions-check:
    name: Repository Permission Check
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check workflow permissions
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking GitHub Actions workflow permissions..."

          for file in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$file" ] || continue

            echo "Checking: $file"

            if grep -qE \
              'permissions:[[:space:]]*write-all' \
              "$file"; then

              echo "::error file=$file::write-all permissions are not allowed."
              exit 1
            fi
          done

          echo "Workflow permission check passed."


  # ==========================================================
  # Security Summary
  # ==========================================================
  summary:
    name: Security Summary
    runs-on: ubuntu-latest

    needs:
      - codeql
      - gradle-dependency-audit
      - secret-scan
      - sensitive-files
      - dangerous-config
      - hardcoded-secrets
      - permissions-check

    if: always()

    steps:
      - name: Security result
        shell: bash
        run: |
          echo "========================================"
          echo "Shahvani Security Pipeline"
          echo "========================================"
          echo ""
          echo "CodeQL:                 ${{ needs.codeql.result }}"
          echo "Gradle Audit:           ${{ needs.gradle-dependency-audit.result }}"
          echo "Secret Scan:            ${{ needs.secret-scan.result }}"
          echo "Sensitive Files:        ${{ needs.sensitive-files.result }}"
          echo "Android Security:       ${{ needs.dangerous-config.result }}"
          echo "Hardcoded Secrets:      ${{ needs.hardcoded-secrets.result }}"
          echo "Workflow Permissions:   ${{ needs.permissions-check.result }}"
          echo ""

          if [[ \
            "${{ needs.codeql.result }}" == "failure" || \
            "${{ needs.gradle-dependency-audit.result }}" == "failure" || \
            "${{ needs.secret-scan.result }}" == "failure" || \
            "${{ needs.sensitive-files.result }}" == "failure" || \
            "${{ needs.dangerous-config.result }}" == "failure" || \
            "${{ needs.hardcoded-secrets.result }}" == "failure" || \
            "${{ needs.permissions-check.result }}" == "failure"
          ]]; then
            echo "Security pipeline FAILED."
            exit 1
          fi

          echo "Security pipeline PASSED."
