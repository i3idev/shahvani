name: Android CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" \
            -type f \
            -name sdkmanager \
            | head -n 1)"

          if [[ -z "${SDKMANAGER}" ]]; then
            echo "::error::sdkmanager was not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "${SDKMANAGER}"

          echo "sdkmanager version:"
          "${SDKMANAGER}" --version

          echo "Accepting Android SDK licenses..."
          yes | "${SDKMANAGER}" --licenses >/dev/null || true

          echo "Installing Android SDK packages..."
          "${SDKMANAGER}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Show build environment
        shell: bash
        run: |
          java -version
          echo
          ./gradlew --version

      - name: Prepare Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --build-cache

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -f "${APK}" ]]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "${APK}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shahvani-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
