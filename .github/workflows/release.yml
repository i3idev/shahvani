name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Run Unit Tests
        run: ./gradlew --no-daemon test

      - name: Run Android Lint
        run: ./gradlew --no-daemon lint

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Build Release AAB
        run: ./gradlew --no-daemon bundleRelease

      - name: Prepare Release Artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          cp app/build/outputs/apk/release/*.apk \
             release/shahvani-release.apk

          cp app/build/outputs/bundle/release/*.aab \
             release/shahvani-release.aab

          echo "Release artifacts:"
          ls -lh release/

      - name: Generate SHA-256 Checksums
        working-directory: release
        run: |
          sha256sum \
            shahvani-release.apk \
            shahvani-release.aab \
            > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/shahvani-release.apk
            release/shahvani-release.aab
            release/SHA256SUMS.txt
